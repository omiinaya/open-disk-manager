name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build libblkid-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja

      - name: Install dependencies (Windows, MSYS2/MinGW)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Provide /tmp for native Windows tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path C:\tmp | Out-Null

      - name: Configure (Release, core + CLI)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF -DBUILD_TESTS=ON -G Ninja

      - name: Build
        run: cmake --build build -j

      - name: Run unit tests
        working-directory: build
        run: ./tests/opm_tests

      - name: Run CTest (CLI E2E on image files, root-free)
        working-directory: build
        run: ctest --output-on-failure -E integration_disk_detection

  gui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build libblkid-dev qt6-base-dev

      - name: Configure + build GUI
        run: |
          cmake -S . -B build-gui -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=ON -DBUILD_TESTS=OFF -G Ninja
          cmake --build build-gui -j

  packaging:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build libblkid-dev rpm

      - name: Build Release
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -G Ninja
          cmake --build build -j

      - name: Package (DEB + RPM)
        run: |
          cd build
          cpack -G DEB
          cpack -G RPM

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opm-packages
          path: build/*.deb
          if-no-files-found: error

  windows-gui-packaging:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-mingw-w64-x86-64-posix wine64

      - name: Install Qt (Windows kit + Linux host kit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          host: 'linux'
          target: 'desktop'
          arch: 'win64_mingw'
          # aqtinstall >= 3.3.0 regressed parsing Qt's online repository XML
          # ("The packages ['qt_base'] were not found"); pin the last good one.
          # install-qt-action installs and RUNS exactly this version, avoiding
          # the user-site-vs-system-site shadowing that breaks a bare pip call.
          aqtversion: '==3.2.1'
          dir: '/opt/qt'
          install-deps: 'true'
          set-env: 'true'

      - name: Install Qt Linux host kit (moc/uic for AUTOMOC)
        run: |
          # The runner has a system aqtinstall (>=3.3.0, broken for 6.9.3).
          # Force-install the pinned good version into the user site and call
          # it directly so user-site wins over system-site.
          python3 -m pip install --user --force-reinstall --no-warn-script-location 'aqtinstall==3.2.1'
          python3 -c "import aqt; print('aqt', getattr(aqt, '__version__', '?'))"
          python3 -m aqt install-qt linux desktop 6.9.3 gcc_64 -O /opt/qt || \
            python3 -m aqt install-qt linux desktop 6.9.3 gcc_64 -O /opt/qt --base https://download.qt.io/online/qtsdkrepository

      - name: Build Windows bundle
        run: |
          chmod +x packaging/build-windows-bundle.sh
          packaging/build-windows-bundle.sh /opt/qt/6.9.3/mingw_64 /opt/qt/6.9.3/gcc_64 dist-win

      - name: Smoke test CLI from bundle (under Wine)
        run: |
          cd dist-win
          export WINEPATH="$PWD"
          wine opm.exe --help >/dev/null 2>&1 && echo "bundle CLI OK"

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: opm-windows-bundle
          path: dist-win
          if-no-files-found: error
