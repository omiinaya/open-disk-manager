name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build libblkid-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja

      - name: Install dependencies (Windows, MSYS2/MinGW)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Provide /tmp for native Windows tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path C:\tmp | Out-Null

      - name: Configure (Release, core + CLI)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF -DBUILD_TESTS=ON -G Ninja

      - name: Build
        run: cmake --build build -j

      - name: Run unit tests
        working-directory: build
        run: ./tests/opm_tests

      - name: Run CTest (CLI E2E on image files, root-free)
        working-directory: build
        run: ctest --output-on-failure -E integration_disk_detection

  gui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build libblkid-dev qt6-base-dev

      - name: Configure + build GUI
        run: |
          cmake -S . -B build-gui -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=ON -DBUILD_TESTS=OFF -G Ninja
          cmake --build build-gui -j

  packaging:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build libblkid-dev rpm

      - name: Build Release
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -G Ninja
          cmake --build build -j

      - name: Package (DEB + RPM)
        run: |
          cd build
          cpack -G DEB
          cpack -G RPM

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opm-packages
          path: build/*.deb
          if-no-files-found: error

  windows-gui-packaging:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-mingw-w64-x86-64-posix wine64

      - name: Set up Python 3.11 (aqtinstall compatibility)
        uses: actions/setup-python@v5
        with:
          # Qt's online repo no longer serves installable metadata for the
          # Linux gcc_64 kit on recent 6.9.x (aqt fails "qt_base not found"),
          # and aqtinstall's XML parsing breaks on Python 3.12. Verified
          # working: aqtinstall 3.2.1 on Python 3.11 with Qt 6.5.3 for BOTH
          # the Windows mingw target and the Linux gcc_64 host kit (matching
          # versions are required for AUTOMOC's cross host-tool resolution).
          python-version: '3.11'

      - name: Install Qt (Windows target + Linux host kits, 6.5.3)
        run: |
          python3 -m pip install --user --force-reinstall --no-warn-script-location 'aqtinstall==3.2.1'
          python3 -m aqt install-qt windows desktop 6.5.3 win64_mingw -O /opt/qt
          python3 -m aqt install-qt linux desktop 6.5.3 gcc_64 -O /opt/qt
          ls /opt/qt/6.5.3/mingw_64/bin/moc.exe /opt/qt/6.5.3/gcc_64/libexec/moc >/dev/null 2>&1

      - name: Build Windows bundle
        run: |
          chmod +x packaging/build-windows-bundle.sh
          packaging/build-windows-bundle.sh /opt/qt/6.5.3/mingw_64 /opt/qt/6.5.3/gcc_64 dist-win

      - name: Smoke test CLI from bundle (under Wine)
        run: |
          cd dist-win
          export WINEPATH="$PWD"
          wine opm.exe --help >/dev/null 2>&1 && echo "bundle CLI OK"

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: opm-windows-bundle
          path: dist-win
          if-no-files-found: error
